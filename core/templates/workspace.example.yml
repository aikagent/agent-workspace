# Personal choices. ./setup writes workspace.yml (gitignored); this file documents the format.
tools: { agent: omp, terminal: tern, secrets: pass }
models: {}                 # optional tier → model; unset tiers use the agent's model roles (omp: @default, @task, @slow)
orgs: []                   # - { id: example, url: "git@github.com:example-org/agent-org.git" }
projects: []               # - { org: example, id: example, name: example-project, roles: [dev, support] }
notes: { kind: none }      # or { kind: vault, path: "~/Notes", folders: { decisions: Decisions, ... } }
# routing: absent = off. Set with ./setup routing set|limits|off; roles are omp model roles, models in preference order.
#   { short: 95, week: 80, roles: { task: [anthropic/claude-sonnet-4-5, openai-codex/gpt-5.5] } }
