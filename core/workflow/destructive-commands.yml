# Shell commands every agent must ask the engineer before running (omp bash.patterns, approval: prompt).
# Everything else runs without a prompt. omp matching: `*` is a wildcard, case-sensitive, whitespace runs collapse,
# and a rule is checked from the start of the whole command and of each segment of a compound line
# (&&, ||, ;, |, subshells). Wrappers are not looked through: `sh -c '…'`, `sudo …` and `env …` hide the command.
# `git *x*` also catches `git -C <dir> x`. Your global ~/.omp/agent/config.yml rules still apply after these.
# An org adds the commands of its own tools in orgs/<org>/destructive-commands.yml (a YAML list of strings, same
# format); it cannot remove these.

# Files
- "rm *"
- "xargs *rm *"
- "unlink *"
- "find * -delete*"
- "find * -exec rm*"
- "*truncate *"
- "shred *"
- "dd *"

# Git: commits, history, branches, discarding uncommitted work, anything leaving the machine
- "git *commit*"
- "git push*"
- "git -C * push*"
- "git -c * push*"
- "git *reset --hard*"
- "git *branch -d*"
- "git *branch -D*"
- "git *branch --delete*"
- "git *tag -d*"
- "git *tag --delete*"
- "git *clean -*"
- "git *rebase*"
- "git *filter-branch*"
- "git *filter-repo*"
- "git *checkout .*"
- "git *checkout -- *"
- "git *checkout * -- *"
- "git *checkout -f*"
- "git *switch *--discard-changes*"
- "git *restore *"
- "git *stash drop*"
- "git *stash clear*"
- "git *worktree remove*"
- "git *update-ref -d*"

